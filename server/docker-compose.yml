# Run from this folder:  ADMIN_PASSWORD=<password> docker compose up -d --build
#
# Nginx Proxy Manager reaches the server over a shared Docker network by
# container name, so no port needs publishing on the host. Set the name of the
# network NPM is on below (find it with: docker network ls).
services:
  monsterjagt-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: monsterjagt-server
    restart: unless-stopped
    environment:
      PORT: "2567"
      # The parent's admin portal at /admin, where games and their spilnøgler are made.
      # Set it in the shell or a .env file next to this one (never the same as a spilnøgle).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD for the admin portal}
      # Only when upgrading an old one-family server: becomes the key of the game "Familien".
      FAMILY_CODE: ${FAMILY_CODE:-}
      # Origin(s) of the client, comma-separated. Leave unset to allow any origin.
      # ALLOWED_ORIGINS: "https://<user>.github.io"
    volumes:
      # The games and their scoreboards, dragons, rewards and backups survive rebuilds here.
      - monsterjagt-data:/data
    networks:
      - proxy

volumes:
  monsterjagt-data:

networks:
  proxy:
    external: true
    name: npm_default # <- the network your Nginx Proxy Manager container is on
